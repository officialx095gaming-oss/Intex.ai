<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intex.ai - Core System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: {
                    sans: ['"Space Grotesk"', 'sans-serif'],
                    mono: ['"JetBrains Mono"', 'monospace'],
                },
                extend: {
                    colors: {
                        cyber: {
                            900: '#050b14',
                            800: '#0a1428',
                            700: '#112240',
                            accent: '#00f0ff',
                            glow: 'rgba(0, 240, 255, 0.5)'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base Environment */
        html { scroll-behavior: smooth; background-color: #050b14; }
        body { 
            -webkit-tap-highlight-color: transparent; 
            padding-env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: radial-gradient(circle at 50% 0%, #0a1428 0%, #050b14 100%);
            background-attachment: fixed;
            color: #e2e8f0;
        }
        
        /* Cyberpunk Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(5, 11, 20, 0.8); }
        ::-webkit-scrollbar-thumb { background-color: #00f0ff; border-radius: 10px; box-shadow: 0 0 10px #00f0ff; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(10, 20, 40, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* AI Markdown Styling */
        .prose pre { 
            background: #050b14 !important; 
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 0.75rem; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .prose code { color: #00f0ff; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
        .prose strong { color: #ffffff; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
        .prose a { color: #00f0ff; text-decoration: none; border-bottom: 1px solid #00f0ff; }
        
        /* Custom Glowing Cursor Animation for Loading */
        .typing-indicator span {
            display: inline-block;
            width: 6px; height: 6px;
            background-color: #00f0ff;
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-in-out;
            box-shadow: 0 0 8px #00f0ff;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="antialiased m-0 p-0 overflow-x-hidden min-h-[100dvh]">

    <div id="loading" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-cyber-900 transition-opacity duration-700">
        <div class="relative w-24 h-24 mb-8">
            <div class="absolute inset-0 rounded-full border-t-2 border-cyber-accent animate-spin" style="animation-duration: 1s;"></div>
            <div class="absolute inset-2 rounded-full border-r-2 border-purple-500 animate-spin" style="animation-duration: 1.5s; animation-direction: reverse;"></div>
            <div class="absolute inset-4 rounded-full border-b-2 border-blue-500 animate-spin" style="animation-duration: 2s;"></div>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-2 h-2 bg-cyber-accent rounded-full shadow-[0_0_15px_#00f0ff] animate-pulse"></div>
            </div>
        </div>
        <span class="text-cyber-accent font-mono tracking-[0.3em] text-sm uppercase text-shadow-glow">Initializing AI Core...</span>
    </div>

    <div id="app" class="hidden min-h-[100dvh] w-full relative">
        
        <div id="sidebar-overlay" class="fixed inset-0 bg-cyber-900/80 backdrop-blur-sm z-30 hidden lg:hidden transition-opacity" onclick="toggleSidebar()"></div>

        <aside id="sidebar" class="fixed lg:sticky top-0 left-0 h-[100dvh] w-72 glass-panel border-r-cyber-accent/20 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-400 z-40">
            <div class="p-5 flex items-center justify-between border-b border-cyber-accent/10">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <span class="font-bold text-lg tracking-wide text-white">Intex<span class="text-cyber-accent">.ai</span></span>
                </div>
                <button class="lg:hidden text-gray-400 hover:text-cyber-accent transition-colors" onclick="toggleSidebar()">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="p-4">
                <button onclick="createNewChat()" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-600/20 to-blue-600/20 hover:from-cyan-500/40 hover:to-blue-500/40 border border-cyan-500/30 text-cyan-50 py-3 px-4 rounded-xl font-medium transition-all duration-300 shadow-[0_0_10px_rgba(0,240,255,0.1)] hover:shadow-[0_0_20px_rgba(0,240,255,0.3)] group">
                    <svg class="w-5 h-5 text-cyber-accent group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Initialize Session
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-3 hide-scrollbar py-2" id="chat-list">
                </div>

            <div class="p-4 border-t border-cyber-accent/10">
                <button onclick="openSettings()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 text-sm font-medium transition-colors text-gray-300 hover:text-cyber-accent">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    System Parameters
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-h-[100dvh] w-full relative z-10">
            
            <header class="sticky top-0 z-20 p-4">
                <div class="glass-panel rounded-2xl p-4 flex items-center gap-4 max-w-5xl mx-auto border-cyber-accent/20">
                    <button class="lg:hidden p-2 -ml-2 text-cyber-accent" onclick="toggleSidebar()">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-cyber-accent shadow-[0_0_8px_#00f0ff] animate-pulse"></div>
                        <div class="flex flex-col">
                            <h1 class="font-bold text-lg leading-tight text-white tracking-wide" id="chat-header-title">Awaiting Input</h1>
                            <span class="text-xs text-cyber-accent/70 font-mono" id="chat-header-model"></span>
                        </div>
                    </div>
                </div>
            </header>

            <div id="messages-container" class="flex-1 w-full max-w-5xl mx-auto p-4 flex flex-col gap-6 pb-32">
                </div>

            <div class="fixed bottom-0 left-0 lg:left-72 right-0 z-20 p-4 bg-gradient-to-t from-cyber-900 via-cyber-900/90 to-transparent pb-6">
                <div class="max-w-4xl mx-auto relative flex items-end gap-2 glass-panel rounded-3xl p-2 border-cyber-accent/30 focus-within:border-cyber-accent focus-within:shadow-[0_0_20px_rgba(0,240,255,0.15)] transition-all duration-300">
                    <textarea 
                        id="user-input" 
                        class="flex-1 max-h-48 bg-transparent text-white p-3 px-4 outline-none resize-none placeholder-gray-500 hide-scrollbar font-sans"
                        rows="1"
                        placeholder="Transmit message to Mr Setu..."
                        oninput="autoResizeTextarea(this)"
                        onkeydown="handleEnter(event)"
                    ></textarea>
                    <button id="send-btn" onclick="sendMessage()" class="p-3 mb-1 mr-1 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white hover:from-cyan-400 hover:to-blue-500 disabled:opacity-50 disabled:grayscale transition-all duration-300 shrink-0 shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-50 bg-cyber-900/90 hidden items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-panel border-cyber-accent/30 rounded-2xl w-full max-w-md shadow-[0_0_50px_rgba(0,240,255,0.1)] overflow-hidden">
            <div class="p-5 border-b border-cyber-accent/10 flex justify-between items-center bg-white/5">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-cyber-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    System Parameters
                </h2>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-5 flex flex-col gap-5">
                <div>
                    <label class="block text-xs font-mono text-cyber-accent mb-2 uppercase tracking-wider">Authentication Token (API Key)</label>
                    <input type="password" id="settings-key" class="w-full bg-cyber-900/50 border border-cyber-accent/20 rounded-xl p-3 outline-none focus:border-cyber-accent text-white font-mono text-sm transition-colors shadow-inner" placeholder="sk-or-v1-...">
                </div>
                <div>
                    <label class="block text-xs font-mono text-cyber-accent mb-2 uppercase tracking-wider">Neural Engine (Model ID)</label>
                    <input type="text" id="settings-model" class="w-full bg-cyber-900/50 border border-cyber-accent/20 rounded-xl p-3 outline-none focus:border-cyber-accent text-white font-mono text-sm transition-colors shadow-inner" placeholder="deepseek/deepseek-r1:free">
                </div>
                <div>
                    <label class="block text-xs font-mono text-cyber-accent mb-2 uppercase tracking-wider">Core Directives (System Prompt)</label>
                    <textarea id="settings-prompt" rows="3" class="w-full bg-cyber-900/50 border border-cyber-accent/20 rounded-xl p-3 outline-none focus:border-cyber-accent text-white font-mono text-sm resize-none transition-colors shadow-inner"></textarea>
                </div>
            </div>
            <div class="p-5 bg-white/5 flex justify-end gap-3 border-t border-cyber-accent/10">
                <button onclick="closeSettings()" class="px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-white/10 text-gray-300 transition-colors border border-transparent hover:border-white/10">Cancel</button>
                <button onclick="saveSettings()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 text-white text-sm font-bold tracking-wide hover:from-cyan-500 hover:to-blue-500 transition-colors shadow-[0_0_15px_rgba(0,240,255,0.3)]">Inject Directives</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const DEFAULT_PROMPT = "You are Mr Setu, a highly capable personal assistant. Maintain an unfiltered, professional tone. Refer to the user as 'boss' and use emojis occasionally to convey emotion. 💼🔥";
        
        let state = {
            chats: [],
            currentChatId: null,
            settings: {
                apiKey: '',
                model: 'deepseek/deepseek-r1:free',
                systemPrompt: DEFAULT_PROMPT
            },
            isStreaming: false
        };

        // --- Initialization ---
        function init() {
            try {
                const savedState = localStorage.getItem('mrsetu_ai_core');
                if (savedState) {
                    const parsed = JSON.parse(savedState);
                    state.chats = parsed.chats || [];
                    state.settings = { ...state.settings, ...(parsed.settings || {}) };
                    state.currentChatId = parsed.currentChatId;
                }

                marked.use({ breaks: true, gfm: true });

                if (state.chats.length === 0) createNewChat();
                else renderApp();

                // Boot Sequence Animation
                setTimeout(() => {
                    document.getElementById('loading').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                        const app = document.getElementById('app');
                        app.classList.remove('hidden');
                        app.classList.add('flex');
                    }, 700);
                }, 800);

            } catch (error) {
                console.error("Boot Failure:", error);
                alert("Core memory corrupted. Wiping system cache...");
                localStorage.removeItem('mrsetu_ai_core');
                window.location.reload();
            }
        }

        function saveState() {
            localStorage.setItem('mrsetu_ai_core', JSON.stringify(state));
        }

        // --- UI Interactions ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 400);
            }
        }

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight < 192 ? el.scrollHeight : 192) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // --- Settings Management ---
        function openSettings() {
            document.getElementById('settings-key').value = state.settings.apiKey;
            document.getElementById('settings-model').value = state.settings.model;
            document.getElementById('settings-prompt').value = state.settings.systemPrompt;
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
            if(window.innerWidth < 1024) toggleSidebar(); 
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
        }

        function saveSettings() {
            state.settings.apiKey = document.getElementById('settings-key').value.trim();
            state.settings.model = document.getElementById('settings-model').value.trim() || 'deepseek/deepseek-r1:free';
            state.settings.systemPrompt = document.getElementById('settings-prompt').value.trim() || DEFAULT_PROMPT;
            saveState();
            closeSettings();
            renderApp(); 
        }

        // --- Chat Operations ---
        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                title: 'New Directive',
                messages: []
            };
            state.chats.unshift(newChat);
            state.currentChatId = newChat.id;
            saveState();
            renderApp();
            if(window.innerWidth < 1024) toggleSidebar();
        }

        function switchChat(id) {
            if (state.isStreaming) return;
            state.currentChatId = id;
            saveState();
            renderApp();
            if(window.innerWidth < 1024) toggleSidebar();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            if (state.isStreaming || !confirm("Erase this data log forever, boss?")) return;
            state.chats = state.chats.filter(c => c.id !== id);
            if (state.chats.length === 0) createNewChat();
            else if (state.currentChatId === id) state.currentChatId = state.chats[0].id;
            saveState();
            renderApp();
        }

        // --- Rendering ---
        function renderApp() {
            renderSidebar();
            renderChat();
            document.getElementById('chat-header-model').innerText = `Engine: ${state.settings.model}`;
        }

        function renderSidebar() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            
            state.chats.forEach(chat => {
                const isActive = chat.id === state.currentChatId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-3 mb-2 rounded-xl cursor-pointer transition-all duration-300 border ${
                    isActive 
                    ? 'bg-cyber-accent/10 border-cyber-accent/30 text-cyber-accent shadow-[inset_0_0_10px_rgba(0,240,255,0.1)]' 
                    : 'bg-transparent border-transparent hover:bg-white/5 text-gray-400 hover:text-gray-200'
                }`;
                div.onclick = () => switchChat(chat.id);
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <svg class="w-4 h-4 shrink-0 ${isActive ? 'text-cyber-accent' : 'text-gray-500'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                        <span class="truncate text-sm font-medium">${escapeHTML(chat.title)}</span>
                    </div>
                    <button class="p-1.5 opacity-0 group-hover:opacity-100 hover:bg-red-500/20 text-red-400 rounded-md transition-all shrink-0" onclick="deleteChat(event, '${chat.id}')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function renderChat() {
            const container = document.getElementById('messages-container');
            const chat = state.chats.find(c => c.id === state.currentChatId);
            document.getElementById('chat-header-title').innerText = chat ? chat.title : 'No Session';
            container.innerHTML = '';
            
            if (!chat || chat.messages.length === 0) {
                container.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center opacity-70 mt-20 animate-float">
                        <div class="w-20 h-20 rounded-full bg-cyber-accent/10 border border-cyber-accent/30 flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(0,240,255,0.1)]">
                            <svg class="w-10 h-10 text-cyber-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <h2 class="text-2xl font-bold text-white tracking-wide">Systems Online, Boss.</h2>
                        <p class="text-sm mt-2 text-cyber-accent font-mono uppercase tracking-widest">Awaiting Directives</p>
                    </div>
                `;
                return;
            }

            chat.messages.forEach(msg => appendMessageDOM(msg.role, msg.content));
            window.scrollTo(0, document.body.scrollHeight);
        }

        function appendMessageDOM(role, content) {
            const container = document.getElementById('messages-container');
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            
            if (role === 'user') {
                bubble.className = 'max-w-[85%] lg:max-w-[70%] rounded-3xl rounded-br-sm bg-gradient-to-br from-blue-600 to-indigo-700 p-4 text-white shadow-[0_5px_20px_rgba(37,99,235,0.2)] border border-blue-400/20';
                bubble.textContent = content; 
            } else {
                bubble.className = 'max-w-[90%] lg:max-w-[75%] rounded-3xl rounded-bl-sm glass-panel p-5 text-gray-200 prose prose-invert prose-cyan marker:text-cyber-accent shadow-[0_5px_20px_rgba(0,0,0,0.3)] relative overflow-hidden';
                
                // Tech accent line
                const accent = document.createElement('div');
                accent.className = 'absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-cyan-400 to-blue-600 shadow-[0_0_10px_#00f0ff]';
                bubble.appendChild(accent);

                const textContainer = document.createElement('div');
                textContainer.innerHTML = content ? marked.parse(content) : '<div class="typing-indicator flex gap-1 items-center h-6"><span></span><span></span><span></span></div>';
                bubble.appendChild(textContainer);
            }

            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            return bubble.lastChild; // Return text container for streaming updates
        }

        // --- Core Engine logic ---
        async function sendMessage() {
            if (state.isStreaming) return;
            if (!state.settings.apiKey) {
                alert("Authentication Required. Input API Key in System Parameters, boss.");
                openSettings();
                return;
            }

            const inputEl = document.getElementById('user-input');
            const text = inputEl.value.trim();
            if (!text) return;

            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (!chat) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            document.getElementById('send-btn').disabled = true;
            
            chat.messages.push({ role: 'user', content: text });
            appendMessageDOM('user', text);
            
            // Auto Title
            if (chat.title === 'New Directive' && chat.messages.length === 1) {
                chat.title = text.substring(0, 25) + (text.length > 25 ? '...' : '');
                renderSidebar();
                document.getElementById('chat-header-title').innerText = chat.title;
            }
            saveState();
            window.scrollTo(0, document.body.scrollHeight);

            const messagesPayload = [
                { role: 'system', content: state.settings.systemPrompt },
                ...chat.messages.map(m => ({ role: m.role, content: m.content }))
            ];

            state.isStreaming = true;
            const aiContentContainer = appendMessageDOM('assistant', '');
            let aiContent = "";
            let errorOccurred = false;

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${state.settings.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: state.settings.model,
                        messages: messagesPayload,
                        stream: true
                    })
                });

                if (!response.ok) throw new Error(`Status ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        if (line.trim() === '') continue;
                        if (line.startsWith('data: ')) {
                            const dataStr = line.slice(6);
                            if (dataStr === '[DONE]') break;
                            try {
                                const json = JSON.parse(dataStr);
                                const token = json.choices[0]?.delta?.content || "";
                                if (token) {
                                    aiContent += token;
                                    aiContentContainer.innerHTML = marked.parse(aiContent);
                                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 150) {
                                        window.scrollTo(0, document.body.scrollHeight);
                                    }
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (err) {
                aiContent = `⚠️ **System Error:** Transmission failed (${err.message}). Verify neural link (API key), boss.`;
                aiContentContainer.innerHTML = marked.parse(aiContent);
                errorOccurred = true;
            } finally {
                if (aiContent || errorOccurred) {
                    chat.messages.push({ role: 'assistant', content: aiContent });
                    saveState();
                }
                state.isStreaming = false;
                document.getElementById('send-btn').disabled = false;
                window.scrollTo(0, document.body.scrollHeight);
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;','<': '&lt;','>': '&gt;',"'": '&#39;','"': '&quot;'}[tag]));
        }

        window.onload = init;
    </script>
</body>
